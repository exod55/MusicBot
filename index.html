<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music News Ecosystem • Billboard × Luxury</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#e2b13c',
            'gold-dim': '#c9a227',
            'billboard-black': '#0a0a0b',
            'glass': 'rgba(20,20,22,0.72)',
            'neon': '#00f5d4'
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'Impact', 'sans-serif'],
            body: ['"Inter"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'glow-gold': '0 0 20px rgba(226,177,60,0.45), 0 0 40px rgba(226,177,60,0.15)',
            'glow-neon': '0 0 15px rgba(0,245,212,0.4)',
            'card': '0 8px 32px rgba(0,0,0,0.55)'
          },
          animation: {
            'pulse-gold': 'pulseGold 2.4s ease-in-out infinite',
            'float': 'float 6s ease-in-out infinite',
            'eq': 'eqBar 0.8s ease-in-out infinite alternate'
          },
          keyframes: {
            pulseGold: {
              '0%,100%': { boxShadow: '0 0 12px rgba(226,177,60,0.3)' },
              '50%': { boxShadow: '0 0 28px rgba(226,177,60,0.7)' }
            },
            float: {
              '0%,100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' }
            },
            eqBar: {
              '0%': { height: '4px' },
              '100%': { height: '18px' }
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0b;
      color: #f5f5f5;
      font-family: 'Inter', system-ui, sans-serif;
    }
    #three-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .glass {
      background: rgba(18,18,20,0.78);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(226,177,60,0.18);
    }
    .glass-strong {
      background: rgba(12,12,14,0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(226,177,60,0.28);
    }
    .neon-hover {
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .neon-hover:hover, .neon-hover:active {
      border-color: rgba(226,177,60,0.7);
      box-shadow: 0 0 24px rgba(226,177,60,0.35), inset 0 0 20px rgba(226,177,60,0.05);
      transform: translateY(-2px);
    }
    .eq-bar {
      width: 3px;
      background: linear-gradient(to top, #e2b13c, #00f5d4);
      border-radius: 2px;
      animation: eqBar 0.7s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.1s; }
    .eq-bar:nth-child(3) { animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { animation-delay: 0.15s; }
    .eq-bar:nth-child(5) { animation-delay: 0.05s; }
    .tab-active {
      color: #e2b13c;
      border-bottom: 2px solid #e2b13c;
      text-shadow: 0 0 12px rgba(226,177,60,0.5);
    }
    .scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #e2b13c33 transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb {
      background: rgba(226,177,60,0.4);
      border-radius: 4px;
    }
    .rank-badge {
      background: linear-gradient(135deg, #e2b13c 0%, #a07c1a 100%);
      color: #0a0a0b;
      font-weight: 700;
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(226,177,60,0.4);
    }
    .stream-pill {
      background: linear-gradient(90deg, rgba(226,177,60,0.15), rgba(0,245,212,0.1));
      border: 1px solid rgba(226,177,60,0.3);
      color: #e2b13c;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .cover-glow {
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(226,177,60,0.2);
    }
    .menu-drawer {
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .menu-drawer.open { transform: translateX(0); }
    .overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .news-card:hover .news-title { color: #e2b13c; }
    .btn-telegram {
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
      box-shadow: 0 4px 14px rgba(42,171,238,0.35);
    }
    .btn-telegram:active { transform: scale(0.97); }
    .skeleton {
      background: linear-gradient(90deg, #1a1a1c 25%, #252528 50%, #1a1a1c 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .grammy-glow {
      filter: drop-shadow(0 0 18px rgba(226,177,60,0.55));
    }
  </style>
</head>
<body class="relative">
  <!-- Three.js Canvas Background -->
  <canvas id="three-canvas"></canvas>

  <!-- App Shell -->
  <div class="relative z-10 flex flex-col h-full">
    <!-- Top Bar -->
    <header class="glass-strong flex items-center justify-between px-4 py-3 shrink-0 border-b border-gold/20">

    <!-- Horizontal Tabs -->

  <!-- Side Menu Drawer -->
  <div id="overlay" class="overlay fixed inset-0 bg-black/60 z-40"></div>
  <aside id="drawer" class="menu-drawer fixed top-0 left-0 h-full w-72 glass-strong z-50 flex flex-col border-r border-gold/20">
    <div class="p-5 border-b border-gold/15">
      <h2 class="font-display text-xl text-gold tracking-wider">NAVIGATION</h2>

    </div>
    <nav class="flex-1 p-3 space-y-1">
      <button data-tab="charts" class="drawer-link w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-white/80 hover:bg-gold/10 hover:text-gold transition">Top Charts</button>
      <button data-tab="news" class="drawer-link w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-white/80 hover:bg-gold/10 hover:text-gold transition">Hollywood Reporter News</button>
      <button data-tab="grammys" class="drawer-link w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-white/80 hover:bg-gold/10 hover:text-gold transition">Grammys 2026</button>

  <script>
    // ─────────────────────────────────────────────
    // Telegram WebApp init
    // ─────────────────────────────────────────────
    const tg = window.Telegram?.WebApp;
    if (tg) {

      tg.expand();

    // Bot username for deep-links (replace with your bot)
    const BOT_USERNAME = 'YourMusicNewsBot';

    // ─────────────────────────────────────────────
    // Mock / Live Data
    // ─────────────────────────────────────────────
    const MOCK_CHARTS = [

      { rank: 6, id: 1456130941, title: "Circles", artist: "Post Malone", year: 2019, streams: "2.98B", artwork: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/cf/..." },
      { rank: 7, id: 1445052496, title: "bad guy", artist: "Billie Eilish", year: 2019, streams: "2.87B", artwork: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/df/..." },
      { rank: 8, id: 1468050002, title: "Watermelon Sugar", artist: "Harry Styles", year: 2019, streams: "2.76B", artwork: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/ef/..." },
      { rank: 9, id: 1440810830, title: "Save Your Tears", artist: "The Weeknd", year: 2020, streams: "2.65B", artwork: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/ff/..." },
      { rank: 10, id: 1452863607, title: "Perfect", artist: "Ed Sheeran", year: 2017, streams: "2.48B", artwork: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/0a/..." }
    ];

    // Enrich with real iTunes artwork when possible
    const REAL_ARTWORK_FALLBACKS = {
      1440810829: "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/60/f8/be/60f8be7c-c3b3-4b8a-0b2e-0e0e0e0e0e0e/20UMGIM12345.rgb.jpg/600x600bb.jpg"
    };

    const MOCK_NEWS = [
      { title: "Sean “Diddy” Combs Reportedly Ran Fort Dix Prison Cell Like a Luxury Suite", source: "The Hollywood Reporter", time: "10h ago", category: "Industry", url: "https://www.hollywoodreporter.com/c/music/music-news/" },
      { title: "Olivia Dean Song Accused of Plagiarizing Bill Withers’ “Just the Two of Us”", source: "THR Music", time: "11h ago", category: "Legal", url: "https://www.hollywoodreporter.com/c/music/music-news/" },
      { title: "Kanye West’s Latest Tour Stop Bites the Dust as St. Petersburg Gigs Canceled", source: "THR", time: "13h ago", category: "Touring", url: "https://www.hollywoodreporter.com/c/music/music-news/" },
      { title: "Jesse Jo Stark and Deadly Doll Sign With BMG", source: "THR Music", time: "17h ago", category: "Deals", url: "https://www.hollywoodreporter.com/c/music/music-news/" },
      { title: "Rick Ross Charged With Battery After Woman Alleges Domestic Violence", source: "Associated Press / THR", time: "1d ago", category: "Legal", url: "https://www.hollywoodreporter.com/c/music/music-news/" },
      { title: "Kelly Clarkson on AI Artists: Shouldn’t Be Competing With Humans on Charts", source: "THR", time: "2d ago", category: "AI / Industry", url: "https://www.hollywoodreporter.com/c/music/music-news/" }
    ];

    const MOCK_GRAMMYS = [
      { category: "Record of the Year", nominees: ["Blinding Lights – The Weeknd", "Flowers – Miley Cyrus", "Anti-Hero – Taylor Swift", "About Damn Time – Lizzo"] },
      { category: "Album of the Year", nominees: ["Midnights – Taylor Swift", "Renaissance – Beyoncé", "Harry's House – Harry Styles", "Un Verano Sin Ti – Bad Bunny"] },
      { category: "Song of the Year", nominees: ["Anti-Hero", "About Damn Time", "As It Was", "Bad Habit"] },
      { category: "Best New Artist", nominees: ["Wet Leg", "Omar Apollo", "Anitta", "Molly Tuttle"] }
    ];

    const MOCK_RELEASES = [
      { title: "Eternal Sunshine (Expanded)", artist: "Ariana Grande", date: "Oct 10, 2026", type: "Album" },
      { title: "HIT ME HARD AND SOFT: The Tour Edition", artist: "Billie Eilish", date: "Oct 15, 2026", type: "Deluxe" },
      { title: "Cowboy Carter Remix Pack", artist: "Beyoncé", date: "Oct 18, 2026", type: "EP" },
      { title: "The Death of Slim Shady (Bonus)", artist: "Eminem", date: "Oct 22, 2026", type: "Album" },
      { title: "Short n' Sweet (Tour Edition)", artist: "Sabrina Carpenter", date: "Nov 1, 2026", type: "Deluxe" }
    ];

    const MOCK_ARTISTS = [
      { name: "Taylor Swift", genre: "Pop", streams: "98.4B", rank: 1 },
      { name: "Drake", genre: "Hip-Hop", streams: "92.1B", rank: 2 },
      { name: "Bad Bunny", genre: "Latin", streams: "78.6B", rank: 3 },
      { name: "The Weeknd", genre: "R&B / Pop", streams: "71.2B", rank: 4 },
      { name: "Ariana Grande", genre: "Pop", streams: "64.8B", rank: 5 },
      { name: "Post Malone", genre: "Hip-Hop / Pop", streams: "58.3B", rank: 6 }
    ];

    // ─────────────────────────────────────────────
    // Three.js Background System
    // ─────────────────────────────────────────────
    let scene, camera, renderer, animationId;
    let currentObjects = [];
    let particles;

    function initThree() {
      const canvas = document.getElementById('three-canvas');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      // Ambient + point lights
      const ambient = new THREE.AmbientLight(0x222222);
      scene.add(ambient);
      const point = new THREE.PointLight(0xe2b13c, 1.2, 20);
      point.position.set(2, 3, 4);
      scene.add(point);
      const point2 = new THREE.PointLight(0x00f5d4, 0.6, 15);
      point2.position.set(-3, -2, 3);
      scene.add(point2);

      createParticles();
      setSceneForTab('charts');
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function createParticles() {
      const count = 180;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 14;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const isGold = Math.random() > 0.4;
        colors[i * 3] = isGold ? 0.89 : 0;
        colors[i * 3 + 1] = isGold ? 0.69 : 0.96;
        colors[i * 3 + 2] = isGold ? 0.24 : 0.83;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.7 });
      particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function clearObjects() {
      currentObjects.forEach(obj => {
        scene.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      });
      currentObjects = [];
    }

    function createVinyl() {
      const group = new THREE.Group();
      // Outer disc
      const discGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.05, 64);
      const discMat = new THREE.MeshStandardMaterial({
        color: 0x111111,
        metalness: 0.7,
        roughness: 0.3,
        emissive: 0x1a1a1a
      });
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.rotation.x = Math.PI / 2;
      group.add(disc);

      // Label
      const labelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.06, 32);
      const labelMat = new THREE.MeshStandardMaterial({
        color: 0xe2b13c,
        metalness: 0.8,
        roughness: 0.2,
        emissive: 0x4a3800
      });
      const label = new THREE.Mesh(labelGeo, labelMat);
      label.rotation.x = Math.PI / 2;
      group.add(label);

      // Groove rings (visual)
      for (let r = 0.55; r < 1.35; r += 0.12) {
        const ringGeo = new THREE.TorusGeometry(r, 0.008, 8, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        group.add(ring);
      }

      group.position.set(0, 0, -1);
      group.userData = { type: 'vinyl', speed: 0.008 };
      scene.add(group);
      currentObjects.push(group);
      return group;
    }

    function createGrammy() {
      const group = new THREE.Group();

      // Base
      const baseGeo = new THREE.BoxGeometry(0.9, 0.18, 0.5);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0xe2b13c,
        metalness: 0.95,
        roughness: 0.15,
        emissive: 0x3a2e00
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -1.1;
      group.add(base);

      // Stem
      const stemGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.9, 16);
      const stem = new THREE.Mesh(stemGeo, baseMat);
      stem.position.y = -0.55;
      group.add(stem);

      // Gramophone body (simplified)
      const bodyGeo = new THREE.SphereGeometry(0.55, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.7);
      const body = new THREE.Mesh(bodyGeo, baseMat);
      body.position.y = 0.15;
      body.rotation.x = -0.3;
      group.add(body);

      // Horn
      const hornGeo = new THREE.ConeGeometry(0.7, 1.1, 24, 1, true);
      const hornMat = new THREE.MeshStandardMaterial({
        color: 0xe2b13c,
        metalness: 0.9,
        roughness: 0.2,
        side: THREE.DoubleSide,
        emissive: 0x2a2000
      });
      const horn = new THREE.Mesh(hornGeo, hornMat);
      horn.position.set(0.15, 0.55, 0.35);
      horn.rotation.x = -1.1;
      horn.rotation.z = 0.25;
      group.add(horn);

      group.position.set(0, 0.2, -1.5);
      group.scale.set(0.85, 0.85, 0.85);
      group.userData = { type: 'grammy', speed: 0.005 };
      scene.add(group);
      currentObjects.push(group);
      return group;
    }

    function setSceneForTab(tab) {
      clearObjects();
      if (tab === 'grammys') {
        createGrammy();
      } else {
        createVinyl();
      }
    }

    function animate() {
      animationId = requestAnimationFrame(animate);
      const t = Date.now() * 0.001;

      if (particles) {
        particles.rotation.y = t * 0.03;
        particles.rotation.x = Math.sin(t * 0.2) * 0.05;
      }

      currentObjects.forEach(obj => {
        if (obj.userData.type === 'vinyl') {
          obj.rotation.z += obj.userData.speed;
          obj.rotation.y = Math.sin(t * 0.4) * 0.15;
          obj.position.y = Math.sin(t * 0.6) * 0.15;
        } else if (obj.userData.type === 'grammy') {
          obj.rotation.y += obj.userData.speed;
          obj.position.y = 0.2 + Math.sin(t * 0.5) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    // ─────────────────────────────────────────────
    // UI Rendering
    // ─────────────────────────────────────────────
    const content = document.getElementById('content');

    function hiResArt(url) {
      if (!url) return 'https://via.placeholder.com/600x600/1a1a1c/e2b13c?text=♪';
      return url.replace('100x100bb', '600x600bb').replace('100x100', '600x600');
    }

    function trackCard(track) {
      const art = hiResArt(track.artwork) || `https://via.placeholder.com/600x600/1a1a1c/e2b13c?text=${encodeURIComponent(track.title.slice(0,1))}`;
      const deepLink = `https://t.me/${BOT_USERNAME}?start=track_${track.id}`;
      return `
        <article class="glass neon-hover rounded-2xl p-3 mb-3 flex gap-3 items-center shadow-card">
          <div class="rank-badge shrink-0">${track.rank}</div>
          <img src="${art}" alt="" class="w-14 h-14 rounded-xl object-cover cover-glow shrink-0"
               onerror="this.src='https://via.placeholder.com/600x600/1a1a1c/e2b13c?text=♪'" />
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-sm truncate leading-tight">${track.title}</h3>
            <p class="text-xs text-white/50 truncate mt-0.5">${track.artist} · ${track.year || ''}</p>
            <div class="flex items-center gap-2 mt-1.5">
              <button class="preview-btn flex items-center gap-1 px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[10px] text-white/70"
                      data-preview="${track.preview || ''}" data-id="${track.id}">
                <span class="eq-bars flex items-end gap-0.5 h-4">
                  <span class="eq-bar" style="height:6px"></span>
                  <span class="eq-bar" style="height:12px"></span>
                  <span class="eq-bar" style="height:8px"></span>
                  <span class="eq-bar" style="height:14px"></span>
                  <span class="eq-bar" style="height:5px"></span>
                </span>
                Preview
              </button>
            </div>
          </div>
          <div class="flex flex-col items-end gap-2 shrink-0">
            <span class="stream-pill px-2 py-1 rounded-full">${track.streams || '—'}</span>
            <a href="${deepLink}" class="btn-telegram text-[10px] font-semibold px-2.5 py-1.5 rounded-lg text-white flex items-center gap-1">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg>
              Bot
            </a>
          </div>
        </article>
      `;
    }

    function renderCharts() {
      content.innerHTML = `
        <div class="mb-4">
          <h2 class="font-display text-3xl text-gold tracking-wider">TOP 100</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">Apple Music · Most Played</p>
        </div>
        <div id="charts-list">
          ${MOCK_CHARTS.map(trackCard).join('')}
        </div>
        <p class="text-center text-[11px] text-white/30 mt-4">Live data via iTunes RSS · Updated hourly</p>
      `;
      // Attempt live fetch (CORS may block; falls back to mock)
      fetchLiveCharts();
    }

    async function fetchLiveCharts() {
      try {
        const res = await fetch('https://rss.applemarketingtools.com/api/v2/us/music/most-played/25/songs.json');
        if (!res.ok) return;
        const data = await res.json();
        const results = data?.feed?.results || [];
        if (results.length === 0) return;
        const list = document.getElementById('charts-list');
        if (!list) return;
        list.innerHTML = results.slice(0, 25).map((item, i) => {
          const art = (item.artworkUrl100 || '').replace('100x100bb', '600x600bb');
          return trackCard({
            rank: i + 1,
            id: item.id,
            title: item.name,
            artist: item.artistName,
            year: (item.releaseDate || '').slice(0, 4),
            streams: '—',
            artwork: art,
            preview: item.url // preview may need separate lookup
          });
        }).join('');
      } catch (e) {
        console.log('Live charts unavailable (CORS), using mock data');
      }
    }

    function renderNews() {
      content.innerHTML = `
        <div class="mb-4">
          <h2 class="font-display text-3xl text-gold tracking-wider">THR NEWS</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">The Hollywood Reporter · Music Desk</p>
        </div>
        ${MOCK_NEWS.map(n => `
          <a href="${n.url}" target="_blank" class="news-card glass neon-hover rounded-2xl p-4 mb-3 block shadow-card">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[10px] font-semibold uppercase tracking-wider text-gold/80 bg-gold/10 px-2 py-0.5 rounded">${n.category}</span>
              <span class="text-[10px] text-white/30">${n.time}</span>
            </div>
            <h3 class="news-title font-semibold text-sm leading-snug transition-colors">${n.title}</h3>
            <p class="text-[11px] text-white/40 mt-2">${n.source}</p>
          </a>
        `).join('')}
      `;
    }

    function renderGrammys() {
      content.innerHTML = `
        <div class="mb-5 text-center">
          <div class="inline-block grammy-glow mb-2">
            <svg width="48" height="48" viewBox="0 0 64 64" fill="#e2b13c">
              <path d="M32 4c-2 8-6 14-12 18 4 2 8 6 10 12 2-6 6-10 10-12-6-4-10-10-12-18z"/>
              <rect x="28" y="34" width="8" height="18" rx="2"/>
              <rect x="20" y="50" width="24" height="6" rx="2"/>
            </svg>
          </div>
          <h2 class="font-display text-3xl text-gold tracking-wider">GRAMMYS 2026</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">68th Annual · Nominations Preview</p>
        </div>
        ${MOCK_GRAMMYS.map(g => `
          <div class="glass rounded-2xl p-4 mb-3 border border-gold/20 shadow-card">
            <h3 class="text-gold font-semibold text-sm uppercase tracking-wider mb-3">${g.category}</h3>
            <ul class="space-y-2">
              ${g.nominees.map(n => `
                <li class="flex items-center gap-2 text-sm text-white/80">
                  <span class="w-1.5 h-1.5 rounded-full bg-gold shrink-0"></span>
                  ${n}
                </li>
              `).join('')}
            </ul>
          </div>
        `).join('')}
      `;
    }

    function renderReleases() {
      content.innerHTML = `
        <div class="mb-4">
          <h2 class="font-display text-3xl text-gold tracking-wider">RELEASE RADAR</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">Upcoming · MusicBrainz + Trackers</p>
        </div>
        ${MOCK_RELEASES.map(r => `
          <div class="glass neon-hover rounded-2xl p-4 mb-3 flex items-center gap-4 shadow-card">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-gold/30 to-gold/5 border border-gold/30 flex items-center justify-center shrink-0">
              <span class="text-gold text-lg">♪</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-sm truncate">${r.title}</h3>
              <p class="text-xs text-white/50 mt-0.5">${r.artist}</p>
            </div>
            <div class="text-right shrink-0">
              <span class="text-[10px] font-semibold uppercase text-neon/80 bg-neon/10 px-2 py-0.5 rounded">${r.type}</span>
              <p class="text-[11px] text-white/40 mt-1">${r.date}</p>
            </div>
          </div>
        `).join('')}
      `;
    }

    function renderArtists() {
      content.innerHTML = `
        <div class="mb-4">
          <h2 class="font-display text-3xl text-gold tracking-wider">TOP ARTISTS</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">By Genre · All-Time Streams</p>
        </div>
        ${MOCK_ARTISTS.map(a => `
          <div class="glass neon-hover rounded-2xl p-3 mb-3 flex items-center gap-3 shadow-card">
            <div class="rank-badge">${a.rank}</div>
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-gold/40 to-gold/10 border border-gold/30 flex items-center justify-center text-gold font-display text-lg">
              ${a.name.charAt(0)}
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-sm truncate">${a.name}</h3>
              <p class="text-xs text-white/50">${a.genre}</p>
            </div>
            <span class="stream-pill px-2.5 py-1 rounded-full">${a.streams}</span>
          </div>
        `).join('')}
      `;
    }

    function renderOAT() {
      content.innerHTML = `
        <div class="mb-4">
          <h2 class="font-display text-3xl text-gold tracking-wider">ALL-TIME</h2>
          <p class="text-xs text-white/40 uppercase tracking-widest mt-1">Most Streamed Songs · OAT</p>
        </div>
        <div id="oat-list">
          ${MOCK_CHARTS.map(t => trackCard({ ...t, streams: t.streams })).join('')}
        </div>
      `;
    }

    const renderers = {
      charts: renderCharts,
      news: renderNews,
      grammys: renderGrammys,
      releases: renderReleases,
      artists: renderArtists,
      oat: renderOAT
    };

    // ─────────────────────────────────────────────
    // Navigation
    // ─────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('tab-active', b.dataset.tab === tab);
        b.classList.toggle('text-white/60', b.dataset.tab !== tab);
      });
      setSceneForTab(tab);
      (renderers[tab] || renderCharts)();
      closeMenu();
      content.scrollTop = 0;
    }

    document.getElementById('tab-bar').addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if (btn) switchTab(btn.dataset.tab);
    });

    document.querySelectorAll('.drawer-link').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Menu drawer
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    document.getElementById('menu-btn').addEventListener('click', () => {
      drawer.classList.add('open');
      overlay.classList.add('open');
    });
    function closeMenu() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
    }
    overlay.addEventListener('click', closeMenu);

    // Preview audio (simple)
    let currentAudio = null;
    content.addEventListener('click', e => {
      const btn = e.target.closest('.preview-btn');
      if (!btn) return;
      const url = btn.dataset.preview;
      if (!url || url.includes('...')) {
        // Fallback: open deep link instead
        const id = btn.dataset.id;
        window.open(`https://t.me/${BOT_USERNAME}?start=track_${id}`, '_blank');
        return;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      currentAudio = new Audio(url);
      currentAudio.play().catch(() => {});
    });

    // Boot
    initThree();
    switchTab('charts');
  </script>
</body>
</html>
