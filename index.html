<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Music News Ecosystem Mini App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{--bg:#f4f4f5;--bg2:#ffffff;--text:#18181b;--muted:#71717a;--card:rgba(255,255,255,0.92);--border:rgba(0,0,0,0.08);--gold:#b8860b;--shadow:0 8px 28px rgba(0,0,0,0.08)}
[data-theme=dark]{--bg:#0a0a0b;--bg2:#121214;--text:#f5f5f5;--muted:rgba(255,255,255,0.45);--card:rgba(18,18,20,0.82);--border:rgba(226,177,60,0.22);--gold:#e2b13c;--shadow:0 8px 32px rgba(0,0,0,0.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
#three-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.55}
.glass{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:var(--shadow)}
.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch}
.rank-badge{background:linear-gradient(135deg,var(--gold),#a07c1a);color:#0a0a0b;font-weight:700;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px}
.stream-pill{background:color-mix(in srgb,var(--gold) 15%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--gold);font-size:10px;font-weight:600}
.tab-active{color:var(--gold)!important;border-bottom:2px solid var(--gold)}
.menu-drawer{transform:translateX(-100%);transition:transform .3s ease}
.menu-drawer.open{transform:translateX(0)}
.overlay{opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.view-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.view-grid{grid-template-columns:repeat(3,1fr)}}
.view-list{display:flex;flex-direction:column;gap:10px}
.card-grid{display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.card-grid .cover-wrap{width:100%;aspect-ratio:1;position:relative}
.card-grid .cover-wrap img{width:100%;height:100%;object-fit:cover}
.card-grid .meta{padding:10px}
.card-list{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.player-bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);backdrop-filter:blur(20px);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .3s}
.player-bar.show{transform:translateY(0)}
.font-display{font-family:"Bebas Neue",sans-serif}
</style>
</head>
<body>
<canvas id="three-canvas"></canvas>
<div class="relative z-10 flex flex-col h-full">
<header class="glass flex items-center justify-between px-3 py-2.5 shrink-0">
<button id="menu-btn" class="btn-icon">☰</button>
<div class="text-center"><h1 class="font-display text-xl tracking-widest" style="color:var(--gold)">BILLBOARD ECOSYSTEM</h1><p class="text-[9px] uppercase tracking-[0.2em]" style="color:var(--muted)">Glowing 3D Mini App</p></div>
<div class="flex gap-1.5">
<button id="theme-btn" class="btn-icon"><span id="theme-icon">🌙</span></button>
<button id="view-btn" class="btn-icon"><span id="view-icon">▦</span></button>
</div>
</header>
<div class="px-3 pt-2 pb-1 shrink-0 flex gap-2">
<input id="search-input" type="search" placeholder="Search songs, artists, news..." class="flex-1 text-sm rounded-xl px-3 py-2 outline-none" style="background:var(--bg2);border:1px solid var(--border);color:var(--text)"/>
<select id="genre-filter" class="text-xs rounded-xl px-2 py-2 outline-none" style="background:var(--bg2);border:1px solid var(--border);color:var(--text)">
<option value="">All genres</option><option>Pop</option><option>Hip-Hop</option><option>R&amp;B</option><option>Rock</option><option>Electronic</option>
</select>
</div>
<nav id="tab-bar" class="flex overflow-x-auto shrink-0 px-2">
<button data-tab="charts" class="tab-btn tab-active px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap">Charts</button>
<button data-tab="news" class="tab-btn px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap" style="color:var(--muted)">THR News</button>
<button data-tab="grammys" class="tab-btn px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap" style="color:var(--muted)">Grammys 2026</button>
<button data-tab="releases" class="tab-btn px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap" style="color:var(--muted)">Release Radar</button>
<button data-tab="artists" class="tab-btn px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap" style="color:var(--muted)">Top Artists</button>
<button data-tab="oat" class="tab-btn px-3 py-2.5 text-[11px] font-semibold uppercase tracking-wider whitespace-nowrap" style="color:var(--muted)">All-Time</button>
</nav>
<main id="content" class="flex-1 scroll-area px-3 py-3 pb-28"></main>
</div>
<div id="player-bar" class="player-bar px-3 py-2 flex items-center gap-3">
<img id="player-art" class="w-11 h-11 rounded-lg object-cover" alt=""/>
<div class="flex-1 min-w-0"><p id="player-title" class="text-sm font-semibold truncate">—</p><p id="player-artist" class="text-[11px] truncate" style="color:var(--muted)">—</p></div>
<button id="player-play" class="btn-icon" style="border-color:var(--gold);color:var(--gold)">▶</button>
<button id="player-close" class="btn-icon" style="color:var(--muted)">✕</button>
</div>
<div id="overlay" class="overlay fixed inset-0 bg-black/50 z-40"></div>
<aside id="drawer" class="menu-drawer fixed top-0 left-0 h-full w-72 z-50 flex flex-col glass">
<div class="p-4" style="border-bottom:1px solid var(--border)"><h2 class="font-display text-lg" style="color:var(--gold)">NAVIGATION</h2></div>
<nav class="flex-1 p-2 space-y-0.5 overflow-y-auto">
<button data-tab="charts" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">Top Charts (100)</button>
<button data-tab="news" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">Hollywood Reporter</button>
<button data-tab="grammys" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">Grammys 2026</button>
<button data-tab="releases" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">Release Radar</button>
<button data-tab="artists" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">Top Artists by Genre</button>
<button data-tab="oat" class="drawer-link w-full text-left px-3 py-2.5 rounded-xl text-sm">All-Time Streams</button>
</nav>
</aside>
<script>
const BOT_USERNAME = "YourMusicNewsBot";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let theme = "dark", viewMode = "list", currentTab = "charts", chartsData = [], audio = null;
const PH = (t) => "https://placehold.co/600x600/1a1a1c/e2b13c?text=" + encodeURIComponent((t || "♪").slice(0, 2));

async function loadCharts() {
  const API = (location.hostname.includes("onrender.com") || location.port) ? location.origin : "";
  try {
    if (API) {
      const r = await fetch(API + "/api/charts?limit=100");
      if (r.ok) {
        const d = await r.json();
        const list = d.tracks || (d.feed && d.feed.results) || (Array.isArray(d) ? d : []);
        if (list.length) {
          chartsData = list.map((item, i) => ({
            rank: item.rank || i + 1,
            id: item.itunes_id || item.id,
            title: item.title || item.name,
            artist: item.artist || item.artistName,
            year: item.year || (item.releaseDate || "").slice(0, 4),
            streams: item.streams || ((2.95 - i * 0.02).toFixed(2) + "B Streams"),
            artwork: (item.artwork_url || item.artworkUrl100 || "").replace("100x100bb", "600x600bb")
          }));
          return;
        }
      }
    }
  } catch(e) {}
  try {
    const r = await fetch("https://rss.applemarketingtools.com/api/v2/us/music/most-played/100/songs.json");
    if (r.ok) {
      const d = await r.json();
      chartsData = (d.feed?.results || []).map((item, i) => ({
        rank: i + 1, id: item.id, title: item.name, artist: item.artistName, year: (item.releaseDate || "").slice(0, 4),
        streams: (2.95 - i * 0.02).toFixed(2) + "B Streams", artwork: (item.artworkUrl100 || "").replace("100x100bb", "600x600bb")
      }));
    }
  } catch(e) {}
}

function trackCard(t) {
  const deep = "https://t.me/" + BOT_USERNAME + "?start=track_" + t.id;
  if (viewMode === "grid") {
    return `<article class="glass card-grid"><div class="cover-wrap"><img src="${t.artwork || PH(t.title)}"/><div class="absolute top-2 left-2 rank-badge">${t.rank}</div></div><div class="meta"><h3 class="font-semibold text-xs truncate">${t.title}</h3><p class="text-[10px] truncate" style="color:var(--muted)">${t.artist}</p><div class="flex items-center justify-between mt-2"><span class="stream-pill px-1.5 py-0.5 rounded-full">${t.streams}</span><a href="${deep}" class="text-[10px] px-2 py-1 rounded-md text-white" style="background:#2AABEE">Bot</a></div></div></article>`;
  }
  return `<article class="glass card-list"><div class="rank-badge shrink-0">${t.rank}</div><img src="${t.artwork || PH(t.title)}" class="w-14 h-14 rounded-xl object-cover shrink-0"/><div class="flex-1 min-w-0"><h3 class="font-semibold text-sm truncate">${t.title}</h3><p class="text-xs truncate" style="color:var(--muted)">${t.artist} · ${t.year}</p></div><div class="flex flex-col items-end gap-1.5 shrink-0"><span class="stream-pill px-2 py-0.5 rounded-full">${t.streams}</span><a href="${deep}" class="text-[10px] font-semibold px-2.5 py-1 rounded-lg text-white" style="background:#2AABEE">Open in Bot</a></div></article>`;
}

const content = document.getElementById("content");
function renderCurrent() {
  content.innerHTML = `<div class="${viewMode === "grid" ? "view-grid" : "view-list"}">${chartsData.map(trackCard).join("")}</div>`;
}

let scene, camera, renderer, particles, objs = [];
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100); camera.position.z = 5;
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three-canvas"), alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  const pl = new THREE.PointLight(0xe2b13c, 1, 20); pl.position.set(2,3,4); scene.add(pl);
  
  const geo = new THREE.BufferGeometry(), pos = new Float32Array(240);
  for(let i=0; i<240; i++) pos[i] = (Math.random() - 0.5) * 10;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particles = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.04, color: 0xe2b13c, transparent: true, opacity: 0.6 }));
  scene.add(particles);
  
  (function anim() {
    requestAnimationFrame(anim);
    particles.rotation.y += 0.002;
    objs.forEach(o => o.rotation.y += 0.01);
    renderer.render(scene, camera);
  })();
}

function setSceneForTab(tab) {
  objs.forEach(o => scene.remove(o)); objs = [];
  const mat = new THREE.MeshStandardMaterial({ color: 0xe2b13c, metalness: 0.8 });
  if (tab === "grammys") {
    const trophy = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 16), mat);
    trophy.position.set(0, 0, -1); scene.add(trophy); objs.push(trophy);
  } else {
    const vinyl = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.05, 32), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    vinyl.rotation.x = Math.PI / 2; vinyl.position.set(0, 0, -1); scene.add(vinyl); objs.push(vinyl);
  }
}

document.getElementById("tab-bar").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b) {
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("tab-active"));
    b.classList.add("tab-active");
    setSceneForTab(b.dataset.tab);
    renderCurrent();
  }
});

initThree();
loadCharts().then(renderCurrent);
</script>
</body>
</html>
